<div class="bs-container" id="bs-root">
 <div id="bs-list-view">
  <div class="bs-header">
    <div>
      <h2 class="bs-title"><i class="fa-solid fa-mug-hot"></i> 브런치 요일별 연재</h2>
      <p class="bs-desc">브런치북 오리지널 연재를 요일별로 모아 봅니다. 카드를 누르면 이 화면에서 바로 읽을 수 있습니다.</p>
    </div>
    <button type="button" class="bs-btn" id="bs-refresh" title="다시 불러오기">
      <i class="fa-solid fa-rotate-right"></i> 새로고침
    </button>
  </div>

  <div class="bs-tabs" role="tablist" id="bs-days">
    <button type="button" class="bs-tab" data-day="MONDAY" role="tab">월</button>
    <button type="button" class="bs-tab" data-day="TUESDAY" role="tab">화</button>
    <button type="button" class="bs-tab" data-day="WEDNESDAY" role="tab">수</button>
    <button type="button" class="bs-tab" data-day="THURSDAY" role="tab">목</button>
    <button type="button" class="bs-tab" data-day="FRIDAY" role="tab">금</button>
    <button type="button" class="bs-tab" data-day="SATURDAY" role="tab">토</button>
    <button type="button" class="bs-tab" data-day="SUNDAY" role="tab">일</button>
    <button type="button" class="bs-tab" data-day="COMPLETE" role="tab">완결</button>
  </div>

  <div class="bs-sorts" id="bs-sorts">
    <button type="button" class="bs-sort" data-sort="PUBLISH_TIME">최신순</button>
    <button type="button" class="bs-sort" data-sort="DONATION_TOTAL_AMOUNT">응원순</button>
    <button type="button" class="bs-sort" data-sort="LIKE_COUNT">라이킷순</button>
  </div>

  <div class="bs-status" id="bs-status" role="status"></div>
  <div class="bs-grid" id="bs-grid"></div>

  <div class="bs-more-wrap">
    <button type="button" class="bs-btn" id="bs-more" style="display: none;">더 보기</button>
  </div>

  <p class="bs-footnote" id="bs-list-foot">
    <i class="fa-solid fa-circle-info"></i>
    목록은 brunch.co.kr 공개 API에서 가져오며 서버에서 5분 동안 보관합니다. 글의 저작권은 각 작가에게 있습니다.
  </p>
 </div>

 <div id="bs-reader" class="bs-reader" style="display: none;">
  <div class="bs-reader-bar">
    <button type="button" class="bs-btn" id="bs-back"><i class="fa-solid fa-arrow-left"></i> 목록</button>
    <div class="bs-reader-bar-right">
      <button type="button" class="bs-btn" id="bs-prev-top" title="이전 화"><i class="fa-solid fa-chevron-left"></i></button>
      <button type="button" class="bs-btn" id="bs-next-top" title="다음 화"><i class="fa-solid fa-chevron-right"></i></button>
      <a class="bs-btn" id="bs-origin" target="_blank" rel="noopener noreferrer" href="https://brunch.co.kr">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> 브런치 원문
      </a>
    </div>
    <div class="bs-tts" id="bs-tts">
      <button type="button" class="bs-btn bs-tts-play" id="bs-tts-play" title="소리 내어 읽기">
        <i class="fa-solid fa-volume-high"></i> <span>듣기</span>
      </button>
      <button type="button" class="bs-btn" id="bs-tts-stop" title="그만 듣기" disabled><i class="fa-solid fa-stop"></i></button>
      <select id="bs-tts-rate" class="bs-tts-select" title="읽기 속도">
        <option value="0.8">0.8x</option>
        <option value="1">1.0x</option>
        <option value="1.2">1.2x</option>
        <option value="1.5">1.5x</option>
        <option value="1.8">1.8x</option>
        <option value="2">2.0x</option>
      </select>
      <select id="bs-tts-voice" class="bs-tts-select" title="목소리"></select>
      <label class="bs-tts-auto" title="글을 다 읽으면 다음 화를 열어 이어서 읽습니다">
        <input type="checkbox" id="bs-tts-next"> 다음 화 이어 듣기
      </label>
      <span class="bs-tts-pos" id="bs-tts-pos"></span>
    </div>
  </div>
  <div class="bs-status" id="bs-reader-status" role="status"></div>
  <article class="bs-article" id="bs-article"></article>
 </div>
</div>
